name: Build the flutter version of RustDesk for Windows ARM64

# Adds a native Windows-on-ARM build to the existing release pipeline.
# Triggered manually for now; the upstream `flutter-build.yml` is left untouched
# so the existing x64 release pipeline is not affected.
#
# References:
#   - https://github.com/rustdesk/rustdesk/discussions/5532
#   - GitHub-hosted `windows-11-arm` runner (free for public repos since 2025-04)

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        type: string
        default: "nightly-arm64"
  push:
    branches:
      - feat/windows-arm64-ci
    paths:
      - ".github/workflows/flutter-build-windows-arm64.yml"
      - "build.py"
      - ".cargo/config.toml"
      - "vcpkg.json"

env:
  # Pinned to the same versions the existing x64 build uses, so the only axis
  # of difference is the target architecture.
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  # Flutter does not yet publish a Windows-on-ARM SDK; we install the x64
  # toolchain (runs fine under Windows-11-ARM emulation) and cross-build the
  # app for ARM64 via --target-platform=windows-arm64. 3.32.x ships Dart 3.8
  # which has stable Windows-ARM64 cross-build support.
  FLUTTER_VERSION: "3.32.8"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.6"
  TAG_NAME: "${{ inputs.upload-tag || 'nightly-arm64' }}"

jobs:
  # Reuse the existing Linux-based bridge generation job — its output is
  # platform-independent Dart/Rust glue code.
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows-arm64:
    name: aarch64-pc-windows-msvc
    needs: [generate-bridge]
    runs-on: windows-11-arm
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Diagnose runner environment
        shell: pwsh
        run: |
          Write-Host "RUNNER_ARCH = $env:RUNNER_ARCH"
          Write-Host "RUNNER_OS   = $env:RUNNER_OS"
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432 = $env:PROCESSOR_ARCHITEW6432"
          Write-Host "OSArchitecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "ProcessArchitecture: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"

      - name: Install LLVM and Clang (woa64 / ARM64 native)
        # KyleMayes/install-llvm-action v1 ships an x64 libclang.dll on this
        # runner — bindgen then refuses to load it ("invalid DLL (x86-64)").
        # Install the official LLVM-on-Windows-ARM64 build directly instead.
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${env:LLVM_VERSION}/LLVM-${env:LLVM_VERSION}-woa64.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-installer.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm-installer.exe" -ArgumentList '/S' -Wait -NoNewWindow
          $llvmBin = "C:\Program Files\LLVM\bin"
          "LIBCLANG_PATH=$llvmBin"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LLVM_PATH=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$llvmBin\clang.exe" --version

      - name: Install Flutter (x64 SDK on ARM64 runner)
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Override the action's auto-detected ARM64 — Flutter does not
          # publish an ARM64 Windows SDK; the x64 SDK runs via emulation and
          # cross-builds ARM64 apps via --target-platform=windows-arm64.
          architecture: x64

      - name: Show flutter / toolchain info and precache engines
        run: |
          flutter doctor -v
          flutter precache --windows
        shell: pwsh

      - name: Install Rust toolchain (aarch64-pc-windows-msvc native host)
        # dtolnay/rust-toolchain installs rustup detected as x86_64 host on
        # this runner (because Node runs as x64 under emulation). Then cargo
        # without `--target` produces x86_64 binaries, which makes magnum-opus
        # pick up the wrong vcpkg triplet. Install rustup with the aarch64
        # default-host flavour so cargo natively targets ARM64.
        shell: pwsh
        run: |
          $url = "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\rustup-init.exe"
          & "$env:RUNNER_TEMP\rustup-init.exe" -y `
            --default-host aarch64-pc-windows-msvc `
            --default-toolchain ${env:RUST_VERSION} `
            --profile minimal `
            --component rustfmt
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" target add aarch64-pc-windows-msvc
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" show

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-11-arm

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-windows-static)
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet arm64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi
          head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-arm64-windows-static-rel-out.log" || true
        shell: bash

      - name: Alias x64-windows-static → arm64-windows-static
        # Several rustdesk-org sys crates (magnum-opus, hwcodec, ...) hard-code
        # `x64-windows-static` for any Windows target. We can't fix those from
        # this repo, so we make the path they look at *be* the arm64 install
        # via an NTFS directory junction. The libs they then load are ARM64
        # because that's actually what we installed.
        shell: pwsh
        run: |
          $arm = "C:\vcpkg\installed\arm64-windows-static"
          $x64 = "C:\vcpkg\installed\x64-windows-static"
          if (-not (Test-Path $arm)) { throw "expected arm64 install at $arm" }
          if (Test-Path $x64) {
            Write-Host "removing pre-existing $x64"
            Remove-Item -Recurse -Force $x64
          }
          cmd /c mklink /J `"$x64`" `"$arm`"
          Write-Host "junction created: $x64 -> $arm"
          Get-ChildItem $x64 | Select-Object -First 5 Name

      - name: Build RustDesk (flutter, ARM64, no hwcodec/vram)
        # First attempt deliberately disables hwcodec / vram features — those
        # bring in x86-tuned native code (nasm, nvenc) and are most likely to
        # fail first. Once base build is green we can layer them back in.
        #
        # SODIUM_LIB_DIR makes libsodium-sys 0.2.x skip its built-in MSVC
        # "download a prebuilt libsodium.lib" path (which only exists for
        # x86/x64) and instead link the libsodium we installed via vcpkg for
        # arm64-windows-static.
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows-static
          RUSTDESK_TARGET_ARCH: arm64
          FLUTTER_TARGET_PLATFORM: windows-arm64
          SODIUM_LIB_DIR: C:\vcpkg\installed\arm64-windows-static\lib
        run: |
          python .\build.py --portable --flutter --skip-portable-pack
        shell: pwsh

      - name: Stage release tree
        shell: pwsh
        run: |
          $arm = ".\flutter\build\windows\arm64\runner\Release"
          $x64 = ".\flutter\build\windows\x64\runner\Release"
          $src = if (Test-Path $arm) { $arm } elseif (Test-Path $x64) { $x64 } else { $null }
          if (-not $src) {
            Write-Error "No Flutter Release directory found under flutter/build/windows/"
            Get-ChildItem -Recurse -Directory ".\flutter\build" | Select-Object FullName
            exit 1
          }
          Write-Host "Staging from $src"
          New-Item -ItemType Directory -Force -Path .\rustdesk | Out-Null
          Copy-Item "$src\*" .\rustdesk -Recurse -Force
          Get-ChildItem .\rustdesk | Select-Object Name, Length

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-aarch64
          path: rustdesk
          if-no-files-found: error
