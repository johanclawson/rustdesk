name: Build the flutter version of RustDesk for Windows ARM64

# Adds a native Windows-on-ARM build to the existing release pipeline.
# Triggered manually for now; the upstream `flutter-build.yml` is left untouched
# so the existing x64 release pipeline is not affected.
#
# References:
#   - https://github.com/rustdesk/rustdesk/discussions/5532
#   - GitHub-hosted `windows-11-arm` runner (free for public repos since 2025-04)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/windows-arm64-ci
    paths:
      - ".github/workflows/flutter-build-windows-arm64.yml"
      - ".github/workflows/bridge.yml"
      - "build.py"
      - ".cargo/config.toml"
      - "vcpkg.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "libs/**"
      - "flutter/**"

env:
  RUST_VERSION: "1.75"            # matches flutter-build.yml
  LLVM_VERSION: "15.0.6"          # matches flutter-build.yml
  # flutter-build.yml pins Flutter 3.24.5; for windows-arm64 we need 3.44.0,
  # the first stable whose engine ships the required artifacts
  # (dart-sdk-windows-arm64.zip, windows-arm64-flutter.zip, …).  `build
  # windows` decides target arch from Abi.current() in dart:ffi — a
  # compile-time property of the bundled Dart VM — so to produce a
  # windows-arm64 binary we must run an arm64 Dart VM.  We install Flutter
  # from git (no bundled dart-sdk) and let its own update_dart_sdk.ps1 fetch
  # the arm64 sdk based on $env:PROCESSOR_ARCHITECTURE, which is "ARM64" in
  # native pwsh on the windows-11-arm runner.
  #
  # Pinned commit of the 3.44.0 tag; tags on flutter/flutter are immutable
  # in practice but a git tag can still be force-pushed, so we anchor by
  # sha. Update both the version comment and the sha together if bumping.
  FLUTTER_COMMIT: "559ffa3f75e7402d65a8def9c28389a9b2e6fe42"  # tags/3.44.0
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  # Reuse the existing Linux-based bridge generation job — its output is
  # platform-independent Dart/Rust glue code.
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows-arm64:
    name: aarch64-pc-windows-msvc
    needs: [generate-bridge]
    runs-on: windows-11-arm
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Diagnose runner environment + assert native ARM64 host
        # We rely on three things being native ARM64 on this runner:
        # 1. pwsh, so update_dart_sdk.ps1 sees PROCESSOR_ARCHITECTURE=ARM64;
        # 2. python, so build.py's platform.machine() picks the arm64 Flutter
        #    output dir; if a future image bundles x64 python we'd silently
        #    write to build/windows/x64/... and fail with a confusing error;
        # 3. the Dart VM we install next, which is decided by (1).
        # Fail loudly here if any of those is x64 so the failure mode is
        # obvious in the log instead of a missing-directory error later.
        shell: pwsh
        run: |
          Write-Host "RUNNER_ARCH = $env:RUNNER_ARCH"
          Write-Host "RUNNER_OS   = $env:RUNNER_OS"
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_ARCHITEW6432 = $env:PROCESSOR_ARCHITEW6432"
          Write-Host "OSArchitecture: $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "ProcessArchitecture: $([System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture)"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected native ARM64 pwsh (PROCESSOR_ARCHITECTURE=ARM64); got '$env:PROCESSOR_ARCHITECTURE'. The Flutter / Dart bootstrap would mis-detect the host."
          }
          $pyArch = python -c "import platform; print(platform.machine())"
          Write-Host "python platform.machine() = $pyArch"
          if ($pyArch -notin @('ARM64','arm64','aarch64')) {
            throw "Expected native ARM64 python on the runner; got '$pyArch'. build.py would write Flutter output to the wrong arch subdir."
          }

      - name: Install LLVM and Clang (woa64 / ARM64 native)
        # KyleMayes/install-llvm-action v1 ships an x64 libclang.dll on this
        # runner — bindgen then refuses to load it ("invalid DLL (x86-64)").
        # Install the official LLVM-on-Windows-ARM64 build directly instead,
        # pinned by sha256 so we don't silently follow a re-uploaded asset.
        shell: pwsh
        env:
          LLVM_WOA64_SHA256: 79D18B9498D7A6C36114F0277C83C91CAF9258194C683A73E5886B68B4D304D1
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-${env:LLVM_VERSION}/LLVM-${env:LLVM_VERSION}-woa64.exe"
          $installer = "$env:RUNNER_TEMP\llvm-installer.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $env:LLVM_WOA64_SHA256) {
            throw "LLVM installer sha256 mismatch: expected $env:LLVM_WOA64_SHA256, got $actual"
          }
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait -NoNewWindow
          $llvmBin = "C:\Program Files\LLVM\bin"
          "LIBCLANG_PATH=$llvmBin"     | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          "LLVM_PATH=C:\Program Files\LLVM" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8NoBOM
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8NoBOM
          & "$llvmBin\clang.exe" --version

      - name: Install Flutter from git (lets bootstrap pick ARM64 dart-sdk)
        # subosito/flutter-action downloads a pre-built x64 zip and the
        # bundled x64 dart-sdk would force every later `flutter build windows`
        # to produce an x64 binary (Abi.current() is compile-time). Clone
        # Flutter directly so its own update_dart_sdk.ps1 runs under native
        # ARM64 pwsh on the windows-11-arm runner, sees
        # $env:PROCESSOR_ARCHITECTURE=ARM64, and downloads the ARM64 dart-sdk.
        shell: pwsh
        run: |
          $flutterRoot = "C:\flutter"
          if (Test-Path $flutterRoot) { Remove-Item -Recurse -Force $flutterRoot }
          # Clone shallow at the pinned commit (mutable tag would be unsafe).
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git $flutterRoot
          git -C $flutterRoot fetch --depth=1 origin ${env:FLUTTER_COMMIT}
          git -C $flutterRoot checkout --detach ${env:FLUTTER_COMMIT}
          "$flutterRoot\bin"                              | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "$flutterRoot\bin\cache\dart-sdk\bin"           | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:Path = "$flutterRoot\bin;$flutterRoot\bin\cache\dart-sdk\bin;$env:Path"
          # First flutter invocation triggers update_dart_sdk.ps1, which checks
          # PROCESSOR_ARCHITECTURE and downloads the matching dart-sdk-windows-*.zip.
          Write-Host "PROCESSOR_ARCHITECTURE = $env:PROCESSOR_ARCHITECTURE"
          flutter --version
          Write-Host "---bundled dart abi---"
          & "$flutterRoot\bin\cache\dart-sdk\bin\dart.exe" --version

      - name: Precache Windows engines (will pick arm64 because Abi=arm64)
        shell: pwsh
        run: |
          flutter doctor -v
          flutter config --enable-windows-desktop
          flutter precache --windows --no-android --no-ios --no-linux --no-macos --no-web --no-fuchsia
          Get-ChildItem "C:\flutter\bin\cache\artifacts\engine\" | Select-Object Name

      - name: Install Rust toolchain (aarch64-pc-windows-msvc native host)
        # dtolnay/rust-toolchain installs rustup detected as x86_64 host on
        # this runner (because Node runs as x64 under emulation). Then cargo
        # without `--target` produces x86_64 binaries, which makes magnum-opus
        # pick up the wrong vcpkg triplet. Install rustup with the aarch64
        # default-host flavour so cargo natively targets ARM64.
        # rustup-init.exe is pinned by sha256 (re-fetch and update if rustup
        # publishes a new build).
        shell: pwsh
        env:
          RUSTUP_INIT_SHA256: 3af309e6c3062aa11df0e932954f69d13b734d8a431e593812f3ecd9ff9e6ef6
        run: |
          $url = "https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe"
          $installer = "$env:RUNNER_TEMP\rustup-init.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:RUSTUP_INIT_SHA256) {
            throw "rustup-init sha256 mismatch: expected $env:RUSTUP_INIT_SHA256, got $actual"
          }
          & $installer -y `
            --default-host aarch64-pc-windows-msvc `
            --default-toolchain ${env:RUST_VERSION} `
            --profile minimal `
            --component rustfmt
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8NoBOM
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" target add aarch64-pc-windows-msvc
          & "$env:USERPROFILE\.cargo\bin\rustup.exe" show

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-11-arm

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-windows-static)
        shell: pwsh
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows-static
        run: |
          # GitHub Actions' pwsh wrapper enables both $ErrorActionPreference
          # = 'stop' and $PSNativeCommandUseErrorActionPreference = $true on
          # pwsh >=7.3, which turns a non-zero native exit into a thrown
          # exception. Without try/catch the step would die before we could
          # dump the vcpkg build logs — exactly the diagnostic the previous
          # bash version preserved. Catch + dump + re-throw.
          try {
            & "$env:VCPKG_ROOT\vcpkg.exe" install `
              --triplet arm64-windows-static `
              --x-install-root="$env:VCPKG_ROOT\installed"
            if ($LASTEXITCODE -ne 0) { throw "vcpkg install exited $LASTEXITCODE" }
          } catch {
            Write-Host "::error::vcpkg install failed: $_"
            Get-ChildItem -Path $env:VCPKG_ROOT -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              Get-Content -Raw $_.FullName
              Write-Host "::endgroup::"
            }
            throw
          }

      - name: Alias x64-windows-static → arm64-windows-static
        # Several rustdesk-org sys crates (magnum-opus, hwcodec, ...) hard-code
        # `x64-windows-static` for any Windows target. We can't fix those from
        # this repo, so we make the path they look at *be* the arm64 install
        # via an NTFS directory junction. The libs they then load are ARM64
        # because that's actually what we installed.
        shell: pwsh
        run: |
          $arm = "C:\vcpkg\installed\arm64-windows-static"
          $x64 = "C:\vcpkg\installed\x64-windows-static"
          if (-not (Test-Path $arm)) { throw "expected arm64 install at $arm" }
          if (Test-Path $x64) {
            Write-Host "removing pre-existing $x64"
            Remove-Item -Recurse -Force $x64
          }
          cmd /c mklink /J `"$x64`" `"$arm`"
          Write-Host "junction created: $x64 -> $arm"
          Get-ChildItem $x64 | Select-Object -First 5 Name

      - name: Build RustDesk (flutter, ARM64, no hwcodec/vram)
        # We deliberately disable hwcodec / vram features for this first
        # build: they pull in x86-tuned native code (nasm, NVENC, QSV) and
        # would block the base build. Layer them back in once upstream
        # rustdesk-org/hwcodec gains arm64-windows triplet awareness.
        #
        # `flutter build windows` picks its target from `Abi.current()` in
        # dart:ffi (a compile-time property of the bundled Dart VM); with the
        # ARM64 dart-sdk installed by the bootstrap step above it builds
        # windows-arm64 automatically.
        #
        # SODIUM_LIB_DIR makes libsodium-sys 0.2.x skip its built-in MSVC
        # "download a prebuilt libsodium.lib" path (which only exists for
        # x86/x64) and link the libsodium that vcpkg just built for
        # arm64-windows-static.
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: arm64-windows-static
          SODIUM_LIB_DIR: C:\vcpkg\installed\arm64-windows-static\lib
        run: |
          python .\build.py --portable --flutter --skip-portable-pack
        shell: pwsh

      - name: Stage release tree (require ARM64 output)
        shell: pwsh
        run: |
          $src = ".\flutter\build\windows\arm64\runner\Release"
          if (-not (Test-Path $src)) {
            Write-Error "Expected ARM64 Flutter Release directory at $src — Flutter probably built x64. Failing fast so we don't upload a mislabelled artifact."
            Get-ChildItem -Recurse -Directory ".\flutter\build" | Select-Object FullName
            exit 1
          }
          New-Item -ItemType Directory -Force -Path .\rustdesk | Out-Null
          Copy-Item "$src\*" .\rustdesk -Recurse -Force
          Get-ChildItem .\rustdesk | Select-Object Name, Length

      - name: Verify rustdesk.exe is ARM64 (PE machine type 0xAA64)
        # Guard against silent regressions to an x64 build: read the PE header
        # of the staged exe + librustdesk.dll + flutter_windows.dll and fail
        # the run if any of them is not aarch64.
        shell: pwsh
        run: |
          $expected = 0xAA64
          $targets  = @('rustdesk.exe', 'librustdesk.dll', 'flutter_windows.dll')
          foreach ($name in $targets) {
            $path = ".\rustdesk\$name"
            if (-not (Test-Path $path)) { throw "missing $path" }
            $bytes     = [System.IO.File]::ReadAllBytes($path)
            $peOffset  = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine   = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $hex       = '0x{0:X4}' -f $machine
            if ($machine -ne $expected) {
              throw "$name PE machine = $hex (expected 0xAA64 / ARM64)"
            }
            Write-Host "$name PE machine = $hex (ARM64) OK"
          }

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-unsigned-windows-aarch64
          path: rustdesk
          if-no-files-found: error
